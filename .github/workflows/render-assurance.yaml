name: Required PDF renders
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    env:
      TYPSTR_EXPECT_QUARTO: '1.10.19'
      TYPSTR_EXPECT_TYPST: '0.15.1'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.19'
      - name: Install PDF tools and reference fonts
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-linuxlibertine
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
      - name: Install source package
        run: R CMD INSTALL .
      - name: Require clean-session public-helper renders and meaningful PDFs
        run: bash tools/run-render-assurance.sh artifacts/render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-evidence
          path: artifacts/render/
          if-no-files-found: error
