title: typstR
author: typstR authors
version: "0.1.0"
quarto-required: ">=1.4.11"
contributes:
  formats:
    typst:
      number-sections: true
      section-numbering: "1.1"
      page-numbering: "1"
      # Preserve native Typst bibliography output. R render helpers select
      # citeproc automatically for inline references, including Quarto 1.4.11.
      # Direct modern Quarto users can set true; on 1.4.11 use the R helpers.
      citeproc: false
      filters:
        - appendix.lua
      template-partials:
        - typst-template.typ
        - typst-show.typ
